name: Site CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 开发目录/xmum/xmum/site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: 开发目录/xmum/xmum/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit all dependencies
        run: npm audit

      - name: Run tests
        run: npm test

      - name: Verify built Worker locally
        run: npm run test:worker

      - name: Run lint
        run: npm run lint

      - name: Verify single-file export
        run: npm run test:single-export
